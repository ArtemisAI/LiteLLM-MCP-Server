[project]
name = "litellm-mcp-server"
version = "1.0.0"
description = "MCP server for managing LiteLLM proxy instances through Claude AI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ArtemisAI", email = "dev@artemisai.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "litellm",
    "api-management",
    "claude",
    "ai-assistant"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ArtemisAI/LiteLLM-MCP-Server"
Documentation = "https://github.com/ArtemisAI/LiteLLM-MCP-Server#readme"
Repository = "https://github.com/ArtemisAI/LiteLLM-MCP-Server.git"
Issues = "https://github.com/ArtemisAI/LiteLLM-MCP-Server/issues"
Changelog = "https://github.com/ArtemisAI/LiteLLM-MCP-Server/releases"
Funding = "https://github.com/sponsors/ArtemisAI"

[project.dependencies]
mcp = ">=0.9.0"
pydantic = ">=2.0.0"
python-dotenv = ">=0.21.0"
psycopg2-binary = ">=2.9.0"
httpx = ">=0.24.0"
redis = ">=5.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["mcp_server"]

[tool.pylint.messages_control]
disable = [
    "C0330", "C0326",  # bad-whitespace
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
