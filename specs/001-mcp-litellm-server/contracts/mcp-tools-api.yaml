openapi: 3.0.0
info:
  title: LiteLLM MCP Management Tools API
  version: 1.0.0
  description: API contract for the tools exposed by the LiteLLM MCP Management Server.

paths:
  /add_model:
    post:
      summary: Add a new model deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddModelParams'
      responses:
        '200':
          description: Model added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddModelResponse'

  /remove_model:
    post:
      summary: Remove a model deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveModelParams'
      responses:
        '200':
          description: Model removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveModelResponse'

  /list_models:
    post:
      summary: List all active model deployments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListModelsParams'
      responses:
        '200':
          description: A list of models
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModelsResponse'

  /update_model_limits:
    post:
      summary: Update rate limits for a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateModelLimitsParams'
      responses:
        '200':
          description: Limits updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateModelLimitsResponse'

  /create_virtual_key:
    post:
      summary: Create a new virtual API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVirtualKeyParams'
      responses:
        '200':
          description: Key created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVirtualKeyResponse'

  /revoke_key:
    post:
      summary: Revoke a virtual API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeKeyParams'
      responses:
        '200':
          description: Key revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeKeyResponse'

  /list_keys:
    post:
      summary: List all virtual keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListKeysParams'
      responses:
        '200':
          description: A list of keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListKeysResponse'

  /update_key_budget:
    post:
      summary: Update the budget for a key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKeyBudgetParams'
      responses:
        '200':
          description: Budget updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateKeyBudgetResponse'

  /update_routing_strategy:
    post:
      summary: Update the routing strategy
      # ... and so on for all 20+ tools

components:
  schemas:
    # Model Management
    AddModelParams:
      type: object
      properties:
        model_name: { type: string }
        provider: { type: string, enum: [openai, gemini, anthropic, azure] }
        api_key: { type: string }
        api_base: { type: string }
        rpm: { type: integer }
        tpm: { type: integer }
        max_parallel: { type: integer }
        pool_name: { type: string }
        region: { type: string }
        timeout: { type: integer }
    AddModelResponse:
      type: object
      properties:
        success: { type: boolean }
        deployment_id: { type: string, format: uuid }
        model_name: { type: string }
        pool_name: { type: string }
        health_check: { type: string }
        available_in_routing: { type: boolean }

    RemoveModelParams:
      type: object
      properties:
        deployment_id: { type: string, format: uuid }
        drain_time: { type: integer }
    RemoveModelResponse:
      type: object
      # ... and so on for all schemas
